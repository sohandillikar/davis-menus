services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: davis-menus-db
    environment:
      POSTGRES_DB: davis_menus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - davis-menus-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: davis-menus-backend
    environment:
      - DB_URL=postgresql://postgres:postgres@postgres:5432/davis_menus
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - davis-menus-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: davis-menus-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - davis-menus-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  davis-menus-network:
    driver: bridge
